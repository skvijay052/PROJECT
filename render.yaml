services:
  - type: web
    name: bandhanaa-backend
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Bandhanaa API
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROFILE_NAME_COLUMN
        value: name
      - key: PROFILE_PHOTOS_BUCKET
        value: profile-images
      - key: DEFAULT_LIST_LIMIT
        value: "20"
      - key: MAX_LIST_LIMIT
        value: "50"
      - key: CORS_ORIGINS
        value: ""
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
